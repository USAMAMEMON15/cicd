name: Create Pull Request and Notify

on:
  push:
    branches-ignore:
      - main

jobs:
  auto-pull-request:
    name: PullRequestAction
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create Pull Request
        id: create_pr
        uses: diillson/auto-pull-request@v1.0.1
        continue-on-error: true
        with:
          source_branch: ""
          destination_branch: "main"
          pr_title: "Pulling ${{ github.ref_name }} into main"
          pr_body: |
            :crown: *An automated PR*
            This pull request has been created automatically by the workflow.
          pr_assignee: "usamammemon15"
          pr_label: "auto-pr"
          pr_allow_empty: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Email Notification (Gmail SMTP)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: usama15memon@gmail.com
          password: agvempuxcjdyixzc
          subject: "Approval required for Pull Request"
          body: |
            A new Pull Request has been created or updated on branch ${{ github.ref_name }}.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Please review and merge on GitHub.
          to: hamza.ali@voxtrongroup.com
          from: usama15memon@gmail.com
